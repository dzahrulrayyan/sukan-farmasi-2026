<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sukan Farmasi 2026</title>
  
  <!-- PWA Meta & Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4338ca">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/861/861512.png">

  <!-- Tailwind CSS & Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-20">

  <!-- Header Atas (Mobile Friendly) -->
  <header class="bg-indigo-700 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-base font-extrabold tracking-tight flex items-center gap-1.5">
          <span>🏆</span> Sukan Farmasi 2026
        </h1>
        <p class="text-[11px] text-indigo-200" id="lastUpdatedTxt">Memuatkan data terkini...</p>
      </div>

      <div class="flex items-center gap-2">
        <button id="pwaInstallBtn" class="hidden text-xs px-2.5 py-1.5 rounded-lg bg-amber-400 text-slate-900 font-extrabold shadow-sm animate-pulse">
          ⬇️ Pasang
        </button>
        <button onclick="fetchData(true)" id="refreshBtn" class="p-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs flex items-center transition" title="Muat semula">
          🔄
        </button>
        <button onclick="toggleAdminModal()" id="adminBadgeBtn" class="text-xs px-2.5 py-1.5 rounded-lg bg-indigo-800 text-indigo-100 font-semibold border border-indigo-500/40">
          🔑 Admin
        </button>
      </div>
    </div>

    <!-- Tab Navigasi Bawah Header -->
    <div class="max-w-md mx-auto px-4 flex border-t border-indigo-600/60 bg-indigo-800/40 text-xs font-semibold">
      <button onclick="switchTab('standings')" id="tabBtnStandings" class="flex-1 py-2.5 text-center border-b-2 border-white text-white font-bold">
        Kedudukan
      </button>
      <button onclick="switchTab('schedule')" id="tabBtnSchedule" class="flex-1 py-2.5 text-center border-b-2 border-transparent text-indigo-200">
        Jadual & Skor
      </button>
    </div>
  </header>

  <!-- Kandungan Utama -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- Status Bar / Banner Admin Aktif -->
    <div id="adminBanner" class="hidden bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs px-3 py-2 rounded-xl flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-1.5 font-bold">
        <span>✅</span> Mod Admin Aktif
      </div>
      <button onclick="logoutAdmin()" class="text-rose-600 font-bold hover:underline">Keluar</button>
    </div>

    <!-- TAB 1: KEDUDUKAN KESELURUHAN (STANDINGS) -->
    <section id="viewStandings" class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Kedudukan Rumah Sukan</h2>
        <span class="text-[10px] bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-bold">4 Pasukan</span>
      </div>

      <div id="standingsContainer" class="space-y-2.5">
        <div class="text-center py-10 text-slate-400 text-sm">Sedang memuat turun data...</div>
      </div>
    </section>

    <!-- TAB 2: JADUAL & PERLAWANAN (SCHEDULE) -->
    <section id="viewSchedule" class="hidden space-y-5">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Pilih Sukan</h2>
        <span class="text-[10px] bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-bold" id="totalMatchesBadge">0 Acara</span>
      </div>

      <!-- Menu Grid ala App Icons -->
      <div id="sportsSummaryContainer" class="grid grid-cols-3 sm:grid-cols-4 gap-y-5 gap-x-2 px-1">
        <!-- Dijana secara dinamik oleh JavaScript -->
      </div>

      <!-- Bahagian Maklumat Lanjut / Perlawanan Sukan Terpilih -->
      <div id="selectedSportDetailSection" class="hidden space-y-3 pt-4 border-t-2 border-slate-200/60 mt-2">
        <div class="flex items-center justify-between bg-indigo-50 p-3 rounded-xl border border-indigo-200 shadow-sm">
          <div class="flex items-center gap-2">
            <span id="selectedSportIcon" class="text-2xl bg-white rounded-lg p-1.5 shadow-sm">🏅</span>
            <div>
              <span class="text-[10px] uppercase font-bold text-indigo-500 tracking-wider">Senarai Perlawanan</span>
              <h3 id="selectedSportTitle" class="text-sm font-extrabold text-indigo-950">Acara</h3>
            </div>
          </div>
          <button onclick="clearSelectedSport()" class="text-xs w-8 h-8 rounded-full bg-white border border-indigo-200 text-indigo-700 font-bold hover:bg-indigo-100 flex items-center justify-center shadow-sm">
            ✕
          </button>
        </div>

        <!-- Senarai Perlawanan Sukan Terpilih -->
        <div id="matchesContainer" class="space-y-2.5">
          <!-- Senarai kad perlawanan -->
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL: LOG MASUK ADMIN -->
  <div id="adminLoginModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl border border-slate-200 text-xs space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="font-extrabold text-sm text-slate-900 flex items-center gap-1.5">
          <span>🔒</span> Akses Admin
        </h3>
        <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-slate-600 text-base">✕</button>
      </div>
      <p class="text-slate-600">Masukkan kata laluan admin untuk kemaskini skor perlawanan.</p>
      
      <input type="password" id="adminPasswordInput" placeholder="Kata laluan" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <div id="loginErrorMsg" class="hidden text-rose-600 font-semibold text-[11px]"></div>

      <div class="flex gap-2 pt-1">
        <button onclick="toggleAdminModal()" class="flex-1 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold">Batal</button>
        <button onclick="loginAdmin()" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 shadow-sm">Masuk</button>
      </div>
    </div>
  </div>

  <!-- MODAL: KEMASKINI SKOR -->
  <div id="editScoreModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-slate-200 text-xs space-y-3.5">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <div>
          <span id="modalMatchSport" class="text-[10px] font-bold text-indigo-600 uppercase tracking-wider">Bola Tampar</span>
          <h3 id="modalMatchStage" class="font-bold text-slate-900 text-sm">Peringkat Kumpulan</h3>
        </div>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
      </div>

      <input type="hidden" id="modalRowId">

      <div class="grid grid-cols-2 gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
        <div>
          <label id="modalTeam1Label" class="block font-bold text-slate-800 truncate mb-1">Pasukan 1</label>
          <input type="number" id="modalScore1" placeholder="0" class="w-full py-2 text-center text-base font-extrabold rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label id="modalTeam2Label" class="block font-bold text-slate-800 truncate mb-1">Pasukan 2</label>
          <input type="number" id="modalScore2" placeholder="0" class="w-full py-2 text-center text-base font-extrabold rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Status Perlawanan</label>
        <select id="modalStatus" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-slate-900 focus:ring-2 focus:ring-indigo-500 bg-white shadow-sm">
          <option value="Belum dimainkan">Belum dimainkan</option>
          <option value="Sedang berlangsung">Sedang berlangsung</option>
          <option value="Selesai">Selesai</option>
        </select>
      </div>

      <div id="updateStatusMsg" class="hidden text-center font-bold text-[11px]"></div>

      <div class="flex gap-2 pt-1">
        <button onclick="closeEditModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold">Batal</button>
        <button onclick="submitScoreUpdate()" id="btnSaveScore" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 flex items-center justify-center gap-1 shadow-sm">
          <span>💾</span> Simpan
        </button>
      </div>
    </div>
  </div>

  <script>
    // PASTIKAN ANDA MENGGANTIKAN URL INI DENGAN URL APPS SCRIPT ANDA
    const API_URL = "https://script.google.com/macros/s/AKfycby_X6VVEgmG9eIhvbhsRQNs4Pnk1eaRwrkyYRFsIvoxzBmfgKG_pHhmdLT03cTGs4RCng/exec";

    let globalData = { standings: [], matches: [] };
    let selectedSport = null;
    let adminPass = localStorage.getItem('sukan_admin_pass') || '';
    let deferredPrompt = null;

    // KEMAS KINI: Warna Gradien untuk Gaya "App Icon"
    const SPORTS_META = {
      'Bola Tampar Lelaki': { icon: '🏐', iconBg: 'bg-gradient-to-br from-blue-400 to-blue-600' },
      'Bola Tampar Wanita': { icon: '🏐', iconBg: 'bg-gradient-to-br from-pink-400 to-pink-600' },
      'Bola Jaring': { icon: '🎯', iconBg: 'bg-gradient-to-br from-indigo-400 to-indigo-600' },
      'Hias Khemah': { icon: '⛺', iconBg: 'bg-gradient-to-br from-amber-400 to-amber-600' },
      'Explore Race': { icon: '🧭', iconBg: 'bg-gradient-to-br from-emerald-400 to-emerald-600' }
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW fail:', err));
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('pwaInstallBtn');
      btn.classList.remove('hidden');
      btn.addEventListener('click', () => {
        btn.classList.add('hidden');
        deferredPrompt.prompt();
      });
    });

    function getTeamMeta(teamName) {
      const s = String(teamName || '').toUpperCase();
      if (s.includes('PKDMT')) return { color: '#f59e0b', bg: 'bg-amber-500' };
      if (s.includes('HM')) return { color: '#2563eb', bg: 'bg-blue-600' };
      if (s.includes('JASIN')) return { color: '#059669', bg: 'bg-emerald-600' };
      if (s.includes('ALOR GAJAH')) return { color: '#e11d48', bg: 'bg-rose-600' };
      return { color: '#64748b', bg: 'bg-slate-600' };
    }

    function switchTab(tab) {
      const isStandings = tab === 'standings';
      document.getElementById('viewStandings').classList.toggle('hidden', !isStandings);
      document.getElementById('viewSchedule').classList.toggle('hidden', isStandings);

      document.getElementById('tabBtnStandings').className = isStandings
        ? 'flex-1 py-2.5 text-center border-b-2 border-white text-white font-bold'
        : 'flex-1 py-2.5 text-center border-b-2 border-transparent text-indigo-200';
      document.getElementById('tabBtnSchedule').className = !isStandings
        ? 'flex-1 py-2.5 text-center border-b-2 border-white text-white font-bold'
        : 'flex-1 py-2.5 text-center border-b-2 border-transparent text-indigo-200';
    }

    async function fetchData(isManual = false) {
      const refreshBtn = document.getElementById('refreshBtn');
      if (isManual) refreshBtn.classList.add('animate-spin');

      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        refreshBtn.classList.remove('animate-spin');

        globalData = data;
        document.getElementById('lastUpdatedTxt').textContent = 'Kemas kini: ' + (data.lastUpdated || '-');
        document.getElementById('totalMatchesBadge').textContent = (data.matches.length || 0) + ' Perlawanan';
        
        renderStandings(data.standings);
        renderSportsSummary(data.matches);
        if (selectedSport) {
          renderMatches(data.matches);
        }
      } catch (err) {
        refreshBtn.classList.remove('animate-spin');
        console.error("Gagal muat turun:", err);
      }
    }

    function renderStandings(standings) {
      const container = document.getElementById('standingsContainer');
      if (!standings || standings.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs">Tiada rekod kedudukan.</div>';
        return;
      }

      container.innerHTML = standings.map((item, idx) => {
        const meta = getTeamMeta(item.team);
        const rank = item.rank || (idx + 1);
        const isLeader = rank == 1;

        return `
          <div class="bg-white rounded-2xl p-4 border ${isLeader ? 'border-amber-300 ring-1 ring-amber-300/60 shadow-md' : 'border-slate-200 shadow-sm'} flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="w-8 h-8 rounded-xl flex items-center justify-center font-extrabold text-xs ${
                rank == 1 ? 'bg-amber-400 text-slate-900' : (rank == 2 ? 'bg-slate-200 text-slate-800' : 'bg-slate-100 text-slate-600')
              }">
                #${rank}
              </span>
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="w-2.5 h-2.5 rounded-full inline-block ${meta.bg}"></span>
                  <h3 class="font-extrabold text-sm text-slate-900">${item.team}</h3>
                </div>
                <p class="text-[11px] text-slate-500">${item.notes || 'Kedudukan Semasa'}</p>
              </div>
            </div>
            <div class="text-right">
              <span class="text-2xl font-black text-slate-900 leading-none">${item.points || 0}</span>
              <span class="block text-[10px] uppercase font-bold text-slate-400">Mata</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // KEMAS KINI: Menjana Grid "App Icon"
    function renderSportsSummary(matches) {
      const container = document.getElementById('sportsSummaryContainer');
      const sportsList = ['Bola Tampar Lelaki', 'Bola Tampar Wanita', 'Bola Jaring', 'Hias Khemah', 'Explore Race'];

      container.innerHTML = sportsList.map(sportName => {
        const meta = SPORTS_META[sportName] || { icon: '🏅', iconBg: 'bg-gradient-to-br from-slate-400 to-slate-600' };
        const isSelected = selectedSport === sportName;
        
        // Pengiraan status untuk lencana (badge) pada ikon
        const sportMatches = (matches || []).filter(m => m.sport === sportName);
        const total = sportMatches.length;
        const completed = sportMatches.filter(m => m.status === 'Selesai').length;
        const live = sportMatches.filter(m => String(m.status).includes('berlangsung')).length;

        let badgeHtml = '';
        if (live > 0) {
          // Ada perlawanan sedang berlangsung - Titik Merah (Live)
          badgeHtml = `
            <span class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 border-2 border-slate-100 rounded-full animate-ping z-10"></span>
            <span class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 border-2 border-slate-100 rounded-full z-10"></span>
          `;
        } else if (total > 0 && total === completed) {
          // Semua selesai - Tanda Tick Hijau
          badgeHtml = `
            <span class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-emerald-500 text-white text-[10px] font-bold flex items-center justify-center border-2 border-slate-100 rounded-full shadow-sm z-10">✓</span>
          `;
        }

        return `
          <button onclick="selectSport('${sportName}')" class="flex flex-col items-center gap-1.5 group outline-none transition-transform active:scale-90">
            <div class="relative w-[65px] h-[65px] sm:w-[70px] sm:h-[70px] rounded-[18px] flex items-center justify-center text-3xl shadow-md transition-all duration-200 ${meta.iconBg} ${isSelected ? 'ring-4 ring-indigo-500/50 scale-95 opacity-80' : 'hover:scale-105'}">
              ${meta.icon}
              ${badgeHtml}
            </div>
            <span class="text-[10px] sm:text-[11px] font-bold text-center leading-tight max-w-[80px] px-1 ${isSelected ? 'text-indigo-700' : 'text-slate-700'}">
              ${sportName}
            </span>
          </button>
        `;
      }).join('');
    }

    function selectSport(sportName) {
      if (selectedSport === sportName) {
        // Jika tekan ikon yang sama, tutup butiran
        clearSelectedSport();
        return;
      }
      selectedSport = sportName;
      
      const meta = SPORTS_META[sportName] || { icon: '🏅' };
      document.getElementById('selectedSportTitle').textContent = sportName;
      document.getElementById('selectedSportIcon').textContent = meta.icon;
      document.getElementById('selectedSportDetailSection').classList.remove('hidden');
      
      // Update gaya ikon supaya nampak mana yang dipilih
      renderSportsSummary(globalData.matches);
      // Muatkan senarai perlawanan
      renderMatches(globalData.matches);
      
      // Scroll sedikit ke bahagian senarai dengan perlahan (UX enhancement)
      setTimeout(() => {
        document.getElementById('selectedSportDetailSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    }

    function clearSelectedSport() {
      selectedSport = null;
      document.getElementById('selectedSportDetailSection').classList.add('hidden');
      renderSportsSummary(globalData.matches);
    }

    function renderMatches(matches) {
      const container = document.getElementById('matchesContainer');
      if (!selectedSport) return;

      const filtered = (matches || []).filter(m => m.sport === selectedSport);
      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs bg-white rounded-xl border border-dashed border-slate-200">Tiada jadual dimasukkan lagi.</div>';
        return;
      }

      const isAdmin = Boolean(adminPass);

      container.innerHTML = filtered.map((m) => {
        const t1 = getTeamMeta(m.team1);
        const t2 = getTeamMeta(m.team2);
        const s1 = m.score1 !== "" ? m.score1 : "-";
        const s2 = m.score2 !== "" ? m.score2 : "-";

        let statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] bg-slate-100 text-slate-600 font-medium">${m.status}</span>`;
        if (m.status === 'Selesai') {
          statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] bg-emerald-50 text-emerald-700 font-bold border border-emerald-200">Selesai</span>`;
        } else if (String(m.status).includes('berlangsung')) {
          statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] bg-amber-50 text-amber-700 font-bold border border-amber-200 animate-pulse">Sedang Main</span>`;
        }

        return `
          <div class="bg-white rounded-2xl p-3.5 border border-slate-200 shadow-sm space-y-2.5">
            <div class="flex items-center justify-between text-[11px] pb-2 border-b border-slate-100">
              <span class="font-bold text-slate-500">${m.stage || 'Perlawanan'}</span>
              ${statusBadge}
            </div>

            <div class="flex items-center justify-between gap-2 py-1">
              <div class="flex-1 flex flex-col items-start gap-1 min-w-0">
                <span class="font-extrabold text-[11px] text-slate-900 truncate w-full">${m.team1}</span>
                <span class="w-8 h-1 rounded-full ${t1.bg}"></span>
              </div>

              <div class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl font-mono font-black text-sm text-slate-800 text-center shadow-inner">
                ${s1} - ${s2}
              </div>

              <div class="flex-1 flex flex-col items-end gap-1 min-w-0 text-right">
                <span class="font-extrabold text-[11px] text-slate-900 truncate w-full">${m.team2 || 'Semua'}</span>
                <span class="w-8 h-1 rounded-full ${t2.bg}"></span>
              </div>
            </div>

            ${isAdmin ? `
              <div class="pt-2 border-t border-slate-100 flex justify-end">
                <button onclick="openEditModal(${m.rowId}, '${m.sport}', '${m.stage}', '${m.team1}', '${m.score1}', '${m.score2}', '${m.team2}', '${m.status}')" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg border border-indigo-200 flex items-center gap-1 transition-colors">
                  ✏️ Kemaskini Skor
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function toggleAdminModal() {
      if (adminPass) {
        alert('Anda sudah log masuk sebagai Admin.');
        return;
      }
      const modal = document.getElementById('adminLoginModal');
      modal.classList.toggle('hidden');
      document.getElementById('loginErrorMsg').classList.add('hidden');
      document.getElementById('adminPasswordInput').value = '';
    }

    async function loginAdmin() {
      const pass = document.getElementById('adminPasswordInput').value.trim();
      if (!pass) return;

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ password: pass, rowId: 0, score1: 0, score2: 0, status: '' })
        });
        const data = await res.json();

        if (data.success) {
          adminPass = pass;
          localStorage.setItem('sukan_admin_pass', pass);
          document.getElementById('adminLoginModal').classList.add('hidden');
          checkAdminStatus();
          if (selectedSport) renderMatches(globalData.matches);
        } else {
          const errBox = document.getElementById('loginErrorMsg');
          errBox.textContent = data.message;
          errBox.classList.remove('hidden');
        }
      } catch (e) {
        alert("Ralat semasa menyemak kata laluan.");
      }
    }

    function logoutAdmin() {
      adminPass = '';
      localStorage.removeItem('sukan_admin_pass');
      checkAdminStatus();
      if (selectedSport) renderMatches(globalData.matches);
    }

    function checkAdminStatus() {
      const hasAdmin = Boolean(adminPass);
      document.getElementById('adminBanner').classList.toggle('hidden', !hasAdmin);
      document.getElementById('adminBadgeBtn').textContent = hasAdmin ? '👤 Admin' : '🔑 Admin';
    }

    function openEditModal(rowId, sport, stage, team1, score1, score2, team2, status) {
      document.getElementById('modalRowId').value = rowId;
      document.getElementById('modalMatchSport').textContent = sport;
      document.getElementById('modalMatchStage').textContent = stage;
      document.getElementById('modalTeam1Label').textContent = team1;
      document.getElementById('modalTeam2Label').textContent = team2 || 'Semua';
      document.getElementById('modalScore1').value = score1 !== "" ? score1 : '';
      document.getElementById('modalScore2').value = score2 !== "" ? score2 : '';
      document.getElementById('modalStatus').value = status || 'Belum dimainkan';
      
      document.getElementById('updateStatusMsg').classList.add('hidden');
      document.getElementById('editScoreModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editScoreModal').classList.add('hidden');
    }

    async function submitScoreUpdate() {
      const rowId = document.getElementById('modalRowId').value;
      const s1 = document.getElementById('modalScore1').value;
      const s2 = document.getElementById('modalScore2').value;
      const st = document.getElementById('modalStatus').value;
      const btn = document.getElementById('btnSaveScore');
      const statusMsg = document.getElementById('updateStatusMsg');

      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            password: adminPass,
            rowId: Number(rowId),
            score1: s1,
            score2: s2,
            status: st
          })
        });
        const data = await res.json();
        btn.disabled = false;
        btn.innerHTML = '<span>💾</span> Simpan';

        if (data.success) {
          statusMsg.textContent = '✅ Berjaya dikemaskini!';
          statusMsg.className = 'text-center font-bold text-[11px] text-emerald-600';
          statusMsg.classList.remove('hidden');
          setTimeout(() => {
            closeEditModal();
            fetchData(true);
          }, 800);
        } else {
          statusMsg.textContent = '❌ ' + data.message;
          statusMsg.className = 'text-center font-bold text-[11px] text-rose-600';
          statusMsg.classList.remove('hidden');
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<span>💾</span> Simpan';
        alert('Ralat semasa kemas kini skor: ' + err.message);
      }
    }

    window.onload = function() {
      checkAdminStatus();
      fetchData();
      setInterval(() => fetchData(), 30000); // Auto refresh setiap 30 saat
    };
  </script>
</body>
</html>
